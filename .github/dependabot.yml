# 의존성 버전/보안 업데이트 PR 자동 생성. PR마다 CI(테스트 + SpotBugs)가 돌아 merge 가능 여부를 판단한다.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      # 패치 버전은 PR 하나로 묶는다. (마이너/메이저는 개별 PR로 따로 검토)
      gradle-patch:
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
