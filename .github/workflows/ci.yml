name: CI

# 모든 push / PR에서 테스트와 정적 분석(SpotBugs)을 실행한다.
# dev push는 CI가 통과한 경우에만 배포(deploy.yml)를 호출한다.
on:
  push:
    branches:
      - dev
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 통합 테스트(@Tag("integration"))용 DB. application-test.yml 의 접속 정보와 맞춘다.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: note_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 앱 로그의 LocalDateTime(잠금 만료 시각 등)이 로컬 개발 환경과 같은 기준이 되도록 KST로 맞춘다.
      - name: Test and static analysis
        env:
          TZ: Asia/Seoul
        run: ./gradlew test integrationTest spotbugsMain --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/tests/
            build/reports/spotbugs/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
