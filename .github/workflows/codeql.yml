name: CodeQL

# 보안 취약점 정적 분석. 결과는 저장소 Security 탭 > Code scanning 에 쌓이고, PR에는 새로 생긴 경고가 표시된다.
on:
  push:
    branches:
      - dev
      - main
  pull_request:
  schedule:
    # 코드 변경이 없어도 새로 추가된 검사 규칙으로 주 1회 다시 분석 (월요일 09:00 KST)
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # build-mode: none 은 빌드 없이 소스만으로 분석한다. (Gradle 빌드/DB 불필요)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
