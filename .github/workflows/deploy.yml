name: Deploy

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build JAR
        run: ./gradlew bootJar -x test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile.dev
          # 맥미니가 Apple Silicon(arm64)일 수 있어 amd64/arm64 둘 다 빌드
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ssunnykku/note:dev
            ssunnykku/note:${{ github.sha }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # appleboy/scp-action, appleboy/ssh-action은 Docker 컨테이너 액션이라 러너 호스트의
      # tailscale0 인터페이스에 접근하지 못함. run: 스텝(호스트에서 직접 실행)으로 대체.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Prepare remote directories
        run: ssh deploy-target 'mkdir -p /Users/dev/projects/note/deploy/back/docker/nginx'

      - name: Copy docker-compose file
        run: scp docker/docker-compose.dev.yml deploy-target:/Users/dev/projects/note/deploy/back/docker/

      - name: Copy nginx config
        run: scp docker/nginx/nginx.conf deploy-target:/Users/dev/projects/note/deploy/back/docker/nginx/

      - name: Create .env file
        run: |
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_URL=${{ secrets.DB_URL }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env

      - name: Copy .env file to server
        run: scp .env deploy-target:/Users/dev/projects/note/deploy/back/docker/

      - name: Deploy
        run: |
          ssh deploy-target '
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            cd /Users/dev/projects/note/deploy/back/docker
            chmod 600 .env
            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d

            echo "Waiting for app health check..."
            for i in $(seq 1 10); do
              if curl -sf http://localhost:8080/test > /dev/null; then
                echo "Health check passed"
                exit 0
              fi
              echo "Attempt $i/10 failed, retrying in 3s..."
              sleep 3
            done

            echo "Health check failed after 10 attempts"
            docker compose -f docker-compose.dev.yml logs --tail=50 app
            exit 1
          '
