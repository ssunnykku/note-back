name: Deploy

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build JAR
        run: ./gradlew bootJar -x test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile.dev
          # 맥미니가 Apple Silicon(arm64)일 수 있어 amd64/arm64 둘 다 빌드
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ssunnykku/note:dev
            ssunnykku/note:${{ github.sha }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Copy docker-compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: 'docker/docker-compose.dev.yml'
          target: '/Users/note/deploy/'

      - name: Copy nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: 'docker/nginx/nginx.conf'
          target: '/Users/note/deploy/'

      - name: Create .env file
        run: |
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_URL=${{ secrets.DB_URL }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env

      - name: Copy .env file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: '.env'
          target: '/Users/note/deploy/docker/'

      - name: Deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # ssh-action의 비대화형 쉘은 .zshrc를 안 읽어 Homebrew docker가 PATH에 안 잡힐 수 있음
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            cd /Users/note/deploy/docker
            chmod 600 .env
            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d

            echo "Waiting for app health check..."
            for i in $(seq 1 10); do
              if curl -sf http://localhost:8080/test > /dev/null; then
                echo "Health check passed"
                exit 0
              fi
              echo "Attempt $i/10 failed, retrying in 3s..."
              sleep 3
            done

            echo "Health check failed after 10 attempts"
            docker compose -f docker-compose.dev.yml logs --tail=50 app
            exit 1
