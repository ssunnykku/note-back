services:
  app:
    image: ssunnykku/note:dev
    env_file:
      - .env
    container_name: note-app
    restart: always
    # nginx만 접근하도록 localhost에만 바인딩 (외부 노출 안 함)
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # 외부에서 직접 접근 못하도록 localhost에만 바인딩
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - ../docker-data/db:/var/lib/postgresql/data

  nginx:
    image: nginx:1.27-alpine
    container_name: note-nginx
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # macOS Docker Desktop은 /Users 하위 경로만 바인드 마운트 가능
      - /Users/note/deploy/front/dist:/usr/share/nginx/html:ro
    depends_on:
      - app
