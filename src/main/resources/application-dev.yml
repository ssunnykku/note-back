spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
jwt:
  secret: ${JWT_SECRET}
  access-expired: 3600000

# 앱은 도커 컨테이너에서 실행되고 Ollama는 Mac mini 호스트에 직접 설치되어 있으므로
# host.docker.internal로 접근한다.
ollama:
  base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}

server:
  port: 8080
  address: 0.0.0.0

# nginx가 프론트/백엔드를 같은 origin으로 묶어서 서빙하므로 CORS 허용 불필요
cors:
  allowed-origins: ""
