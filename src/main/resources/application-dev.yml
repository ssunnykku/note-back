spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
jwt:
  secret: ${JWT_SECRET}
  access-expired: 3600000

server:
  port: 8080
  address: 0.0.0.0

# nginx가 프론트/백엔드를 같은 origin으로 묶어서 서빙하므로 CORS 허용 불필요
cors:
  allowed-origins: ""
