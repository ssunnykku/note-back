spring:
  profiles:
    active: dev
  jpa:
    # 요청 전체(Ollama 대기 포함)에 DB 커넥션이 묶이지 않도록 트랜잭션 범위에서만 커넥션을 사용한다.
    open-in-view: false
  flyway:
    # 스키마 변경은 db/migration 의 V{n}__*.sql 로만 한다. 적용된 파일은 수정 금지(체크섬 불일치로 기동 실패).
    # Flyway 도입 전부터 테이블이 있던 DB는 V1(초기 스키마)을 적용된 것으로 간주하고 V2부터 실행한다.
    baseline-on-migrate: true
    baseline-version: 1

logging:
  level:
    root: INFO
    com.sun.note: DEBUG

# AI 채팅 사용량 제한 (기본값은 ChatProperties)
chat:
  history:
    max-messages: 20    # AI에 함께 보낼 최근 메시지 수
    max-chars: 12000    # 이전 대화 + 새 메시지 글자 수 합계 상한
  rate-limit:
    max-requests: 10    # 사용자별 window 동안 전송 가능 횟수
    window: 2m
